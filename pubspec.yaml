name: net_toolkit_pro
description: "Network Toolkit Pro - all-in-one network utilities (ping monitor, speed test, port scanner, LAN discovery, WiFi info)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5
  network_info_plus: ^8.2.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
